name: CI Build

# Builds pull requests and submits resolved dependencies on pushes and manual runs.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Build Solution
        run: dotnet build OpenSourceToolkit.Net.sln -c Release -p:UseLocalFlowery=false

  dependency-submission:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Restore NuGet dependencies
        run: dotnet restore OpenSourceToolkit.Net.sln -p:UseLocalFlowery=false

      - name: Submit NuGet dependency graph
        uses: advanced-security/component-detection-dependency-submission-action@v0.2.0
        with:
          detectorsCategories: NuGet
          fail-on-empty: true

