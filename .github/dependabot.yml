version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /OpenSourceToolkit.*
    ignore:
      # PDFsharp 6.5 changes from MIT to AGPL or a commercial license.
      - dependency-name: PDFsharp
        versions: ['>= 6.5.0']
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
